services:
  postgres:
    image: postgres:16-alpine
    container_name: mentis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mentis
      POSTGRES_PASSWORD: mentis
      POSTGRES_DB: mentis
    ports:
      - "5432:5432"
    volumes:
      - mentis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentis -d mentis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mentis_postgres:
